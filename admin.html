<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Cyberpunk Launcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-6">

  <div class="max-w-6xl w-full mx-auto space-y-6">
    
    <!-- LOGIN BOX -->
    <div id="admin-login-box" class="max-w-md mx-auto cyber-glass p-8 rounded-2xl mt-12 space-y-4">
      <div class="text-center space-y-1">
        <i class="fa-solid fa-shield-halved text-3xl text-cyan-400 animate-bounce"></i>
        <h2 class="text-xl font-bold text-cyan-300">Đăng Nhập Quản Trị</h2>
      </div>
      <form id="form-login" class="space-y-4">
        <input type="email" id="login-email" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-cyan-400 focus:outline-none" placeholder="Email Admin..." required />
        <input type="password" id="login-pass" class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-white focus:border-cyan-400 focus:outline-none" placeholder="Mật khẩu..." required />
        <button type="submit" class="cyber-btn w-full py-2.5 rounded-lg">Xác Thực Truy Cập</button>
      </form>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="admin-dashboard" class="hidden space-y-6">
      
      <div class="flex justify-between items-center cyber-glass p-4 rounded-xl">
        <h2 class="text-lg font-bold text-cyan-400"><i class="fa-solid fa-gauge-high mr-2"></i>Admin Dashboard Panel</h2>
        <div class="flex gap-3">
          <a href="index.html" target="_blank" class="cyber-btn px-3 py-1.5 rounded text-xs flex items-center gap-1"><i class="fa-solid fa-globe"></i> Xem Web</a>
          <button id="btn-logout" class="cyber-btn cyber-btn-pink px-3 py-1.5 rounded text-xs">Đăng Xuất</button>
        </div>
      </div>

      <!-- FORM THÊM / SỬA BÀI -->
      <div class="cyber-glass p-6 rounded-xl space-y-4">
        <h3 id="form-title" class="font-bold text-cyan-300 border-b border-cyan-500/20 pb-2">Thêm Bài Viết / Game Mới</h3>
        <form id="form-post" class="space-y-4">
          <input type="hidden" id="post-id" />
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="text" id="post-title" class="px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white focus:border-cyan-400 focus:outline-none" placeholder="Tiêu đề bài viết / game..." required />
            <select id="post-category" class="px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white focus:border-cyan-400 focus:outline-none">
              <option value="game">/Game (Game & Tools)</option>
              <option value="post">/Post (Bài viết kỹ thuật)</option>
              <option value="blog">/Blog (Blog cá nhân)</option>
              <option value="support">/Support (Hỗ trợ)</option>
            </select>
          </div>
          <input type="url" id="post-image" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white focus:border-cyan-400 focus:outline-none" placeholder="Link ảnh Banner..." required />
          <input type="url" id="post-download-link" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white focus:border-cyan-400 focus:outline-none" placeholder="Link tải gốc (Tự động mã hóa Base64 chống Bot)..." />
          <textarea id="post-content" rows="3" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded text-white focus:border-cyan-400 focus:outline-none" placeholder="Mô tả chi tiết / Hướng dẫn cài đặt..." required></textarea>
          
          <div class="flex gap-3">
            <button type="submit" id="btn-save" class="cyber-btn px-6 py-2 rounded-lg text-sm">Đăng Lên Hệ Thống</button>
            <button type="button" id="btn-cancel" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-lg text-sm hidden">Hủy Bỏ</button>
          </div>
        </form>
      </div>

      <!-- QUẢN LÝ BÀI ĐÃ ĐĂNG -->
      <div class="cyber-glass p-6 rounded-xl space-y-4">
        <h3 class="font-bold text-cyan-300">Danh Sách Nội Dung Đã Đăng</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-950 text-cyan-400">
              <tr>
                <th class="p-3">Ảnh</th>
                <th class="p-3">Tiêu Đề</th>
                <th class="p-3">Mục</th>
                <th class="p-3">Thao Tác</th>
              </tr>
            </thead>
            <tbody id="admin-table-body" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>

      <!-- LỊCH SỬ TRUY CẬP REALTIME -->
      <div class="cyber-glass p-6 rounded-xl space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-bold text-pink-400"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Lịch Sử Truy Cập Web Realtime</h3>
          <button id="btn-clear-logs" class="bg-pink-600/20 hover:bg-pink-600 text-pink-300 hover:text-white border border-pink-500/40 text-xs px-3 py-1.5 rounded transition">Xóa Lịch Sử</button>
        </div>
        <div class="overflow-x-auto max-h-60 overflow-y-auto">
          <table class="w-full text-left text-xs text-slate-300">
            <thead class="bg-slate-950 sticky top-0 text-cyan-400">
              <tr>
                <th class="p-2.5">Thời Gian</th>
                <th class="p-2.5">Thiết Bị</th>
                <th class="p-2.5">Đường Dẫn</th>
                <th class="p-2.5">Trình Duyệt (User Agent)</th>
              </tr>
            </thead>
            <tbody id="logs-table-body" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
